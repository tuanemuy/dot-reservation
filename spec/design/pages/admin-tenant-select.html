<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>テナント選択 - 管理画面 - dot.reservation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Sans+JP:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Primary (Sage Green) */
      --color-primary-lighter: oklch(0.96 0.02 155);
      --color-primary-light: oklch(0.78 0.06 155);
      --color-primary: oklch(0.52 0.08 155);
      --color-primary-dark: oklch(0.45 0.07 155);
      --color-primary-darker: oklch(0.36 0.06 155);

      /* Secondary (Rose) */
      --color-secondary-lighter: oklch(0.96 0.02 350);
      --color-secondary-light: oklch(0.84 0.06 350);
      --color-secondary: oklch(0.65 0.12 350);
      --color-secondary-dark: oklch(0.52 0.12 350);
      --color-secondary-darker: oklch(0.40 0.12 350);

      /* Accent (Warm Gold) */
      --color-accent-lighter: oklch(0.97 0.02 75);
      --color-accent-light: oklch(0.84 0.08 75);
      --color-accent: oklch(0.67 0.11 75);
      --color-accent-dark: oklch(0.53 0.10 75);
      --color-accent-darker: oklch(0.43 0.09 75);

      /* Neutral */
      --color-neutral-50: oklch(0.99 0.002 80);
      --color-neutral-100: oklch(0.97 0.004 80);
      --color-neutral-200: oklch(0.94 0.005 80);
      --color-neutral-300: oklch(0.88 0.006 80);
      --color-neutral-400: oklch(0.78 0.006 80);
      --color-neutral-500: oklch(0.65 0.006 80);
      --color-neutral-600: oklch(0.55 0.006 80);
      --color-neutral-700: oklch(0.45 0.006 80);
      --color-neutral-800: oklch(0.35 0.006 80);
      --color-neutral-900: oklch(0.25 0.006 80);

      /* Semantic */
      --color-success: oklch(0.55 0.12 145);
      --color-warning: oklch(0.72 0.14 70);
      --color-error: oklch(0.55 0.16 25);
      --color-info: oklch(0.55 0.10 240);

      /* Background */
      --color-bg-page: #FFFFFF;
      --color-bg-card: #FFFFFF;
      --color-bg-section: var(--color-neutral-100);
      --color-bg-elevated: #FFFFFF;

      /* Typography */
      --font-heading: 'Inter', 'Noto Sans JP', system-ui, sans-serif;
      --font-body: 'Inter', 'Noto Sans JP', system-ui, sans-serif;
      --text-xs: clamp(0.6875rem, 0.65rem + 0.1vw, 0.75rem);
      --text-sm: clamp(0.75rem, 0.7rem + 0.15vw, 0.8125rem);
      --text-base: clamp(0.8125rem, 0.75rem + 0.2vw, 0.9375rem);
      --text-lg: clamp(0.9375rem, 0.85rem + 0.25vw, 1.0625rem);
      --text-xl: clamp(1.125rem, 1rem + 0.3vw, 1.25rem);
      --text-2xl: clamp(1.375rem, 1.2rem + 0.5vw, 1.625rem);
      --text-3xl: clamp(1.75rem, 1.5rem + 0.7vw, 2.125rem);
      --weight-light: 300;
      --weight-normal: 400;
      --weight-medium: 500;
      --weight-semibold: 600;
      --leading-tight: 1.3;
      --leading-normal: 1.7;
      --leading-relaxed: 1.9;
      --tracking-tight: -0.02em;
      --tracking-normal: 0;
      --tracking-wide: 0.04em;

      /* Spacing */
      --space-xs: 0.25rem;
      --space-sm: 0.5rem;
      --space-md: 1rem;
      --space-lg: 1.5rem;
      --space-xl: 2rem;
      --space-2xl: 2.5rem;
      --space-3xl: 3.5rem;
      --space-section: 5rem;

      /* Border Radius */
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --radius-xl: 16px;
      --radius-full: 9999px;

      /* Shadow */
      --shadow-sm: 0 1px 2px oklch(0 0 0 / 0.04);
      --shadow-md: 0 2px 8px oklch(0 0 0 / 0.06);
      --shadow-lg: 0 4px 16px oklch(0 0 0 / 0.08);

      /* Transition */
      --transition-fast: 0.1s ease;
      --transition-default: 0.15s ease;
      --transition-slow: 0.25s ease;
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-body);
      color: var(--color-neutral-700);
      background-color: var(--color-bg-section);
      line-height: var(--leading-normal);
      font-weight: var(--weight-normal);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ===== Header ===== */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--color-bg-page);
      border-bottom: 1px solid var(--color-neutral-300);
    }

    .header-inner {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 var(--space-2xl);
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-family: var(--font-heading);
      font-size: var(--text-lg);
      font-weight: var(--weight-semibold);
      color: var(--color-neutral-900);
      text-decoration: none;
      letter-spacing: var(--tracking-tight);
    }

    .logo span {
      color: var(--color-primary);
    }

    .user-menu-btn {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      height: 40px;
      padding: 0 var(--space-md);
      border-radius: var(--radius-md);
      border: none;
      background: transparent;
      cursor: pointer;
      color: var(--color-neutral-700);
      font-family: var(--font-body);
      font-size: var(--text-sm);
      font-weight: var(--weight-medium);
      transition: background var(--transition-default);
    }

    .user-menu-btn:hover {
      background: var(--color-neutral-200);
    }

    .user-menu-btn:focus-visible {
      outline: 2px solid var(--color-primary);
      outline-offset: 2px;
    }

    .user-avatar {
      width: 28px;
      height: 28px;
      border-radius: var(--radius-full);
      background: linear-gradient(135deg, var(--color-secondary-lighter), var(--color-secondary-light));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--text-xs);
      font-weight: var(--weight-medium);
      color: var(--color-secondary);
    }

    .user-menu-chevron svg {
      width: 14px;
      height: 14px;
      color: var(--color-neutral-500);
    }

    /* ===== Main Content ===== */
    .main-content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-3xl) var(--space-xl);
    }

    .select-container {
      width: 100%;
      max-width: 560px;
    }

    .page-heading {
      font-family: var(--font-heading);
      font-size: var(--text-2xl);
      font-weight: var(--weight-semibold);
      color: var(--color-neutral-900);
      letter-spacing: var(--tracking-tight);
      line-height: var(--leading-tight);
      margin-bottom: var(--space-sm);
      text-align: center;
    }

    .page-description {
      font-size: var(--text-sm);
      color: var(--color-neutral-500);
      text-align: center;
      margin-bottom: var(--space-xl);
    }

    /* ===== Tenant Cards ===== */
    .tenant-list {
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
      margin-bottom: var(--space-2xl);
    }

    .tenant-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-lg) var(--space-xl);
      background: var(--color-bg-card);
      border: 1px solid var(--color-neutral-300);
      border-radius: var(--radius-lg);
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      transition: border-color var(--transition-default), box-shadow var(--transition-default);
    }

    .tenant-card:hover {
      border-color: var(--color-primary-light);
      box-shadow: var(--shadow-sm);
    }

    .tenant-card:focus-visible {
      outline: 2px solid var(--color-primary);
      outline-offset: 2px;
    }

    .tenant-card-info {
      display: flex;
      align-items: center;
      gap: var(--space-md);
    }

    .tenant-card-icon {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-md);
      background: var(--color-neutral-200);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .tenant-card-icon svg {
      width: 22px;
      height: 22px;
      color: var(--color-neutral-600);
    }

    .tenant-card-name {
      font-size: var(--text-lg);
      font-weight: var(--weight-semibold);
      color: var(--color-neutral-800);
      letter-spacing: var(--tracking-tight);
    }

    .tenant-card-right {
      display: flex;
      align-items: center;
      gap: var(--space-md);
    }

    .role-badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 12px;
      border-radius: var(--radius-full);
      font-size: var(--text-xs);
      font-weight: var(--weight-medium);
      white-space: nowrap;
    }

    .role-badge--admin {
      background: var(--color-primary-lighter);
      color: var(--color-primary);
    }

    .role-badge--staff {
      background: var(--color-secondary-lighter);
      color: var(--color-secondary-dark);
    }

    .tenant-card-arrow svg {
      width: 18px;
      height: 18px;
      color: var(--color-neutral-500);
    }

    /* ===== Bottom Section ===== */
    .bottom-section {
      border-top: 1px solid var(--color-neutral-300);
      padding-top: var(--space-xl);
    }

    .bottom-section-title {
      font-size: var(--text-sm);
      color: var(--color-neutral-500);
      text-align: center;
      margin-bottom: var(--space-md);
    }

    .bottom-links {
      display: flex;
      justify-content: center;
      gap: var(--space-xl);
    }

    .bottom-link {
      display: inline-flex;
      align-items: center;
      gap: var(--space-sm);
      font-size: var(--text-sm);
      font-weight: var(--weight-medium);
      color: var(--color-primary);
      text-decoration: none;
      padding: var(--space-sm) var(--space-md);
      border-radius: var(--radius-md);
      transition: background var(--transition-default), color var(--transition-default);
    }

    .bottom-link:hover {
      background: var(--color-primary-lighter);
      color: var(--color-primary-dark);
    }

    .bottom-link:focus-visible {
      outline: 2px solid var(--color-primary);
      outline-offset: 2px;
    }

    .bottom-link svg {
      width: 16px;
      height: 16px;
    }

    /* ===== Footer ===== */
    .footer {
      border-top: 1px solid var(--color-neutral-300);
      background: var(--color-bg-page);
    }

    .footer-inner {
      max-width: 1280px;
      margin: 0 auto;
      padding: var(--space-xl) var(--space-2xl);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .footer-logo {
      font-family: var(--font-heading);
      font-size: var(--text-base);
      font-weight: var(--weight-semibold);
      color: var(--color-neutral-500);
      text-decoration: none;
    }

    .footer-logo span {
      color: var(--color-primary);
    }

    .footer-copy {
      font-size: var(--text-xs);
      color: var(--color-neutral-500);
    }
  </style>
</head>
<body>

</body>
