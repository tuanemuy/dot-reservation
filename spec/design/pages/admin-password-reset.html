<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>パスワードリセット - 管理画面 - dot.reservation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Sans+JP:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Primary (Sage Green) */
      --color-primary-lighter: oklch(0.96 0.02 155);
      --color-primary-light: oklch(0.78 0.06 155);
      --color-primary: oklch(0.52 0.08 155);
      --color-primary-dark: oklch(0.45 0.07 155);
      --color-primary-darker: oklch(0.36 0.06 155);

      /* Secondary (Rose) */
      --color-secondary-lighter: oklch(0.96 0.02 350);
      --color-secondary-light: oklch(0.84 0.06 350);
      --color-secondary: oklch(0.65 0.12 350);
      --color-secondary-dark: oklch(0.52 0.12 350);
      --color-secondary-darker: oklch(0.40 0.12 350);

      /* Accent (Warm Gold) */
      --color-accent-lighter: oklch(0.97 0.02 75);
      --color-accent-light: oklch(0.84 0.08 75);
      --color-accent: oklch(0.67 0.11 75);
      --color-accent-dark: oklch(0.53 0.10 75);
      --color-accent-darker: oklch(0.43 0.09 75);

      /* Neutral */
      --color-neutral-50: oklch(0.99 0.002 80);
      --color-neutral-100: oklch(0.97 0.004 80);
      --color-neutral-200: oklch(0.94 0.005 80);
      --color-neutral-300: oklch(0.88 0.006 80);
      --color-neutral-400: oklch(0.78 0.006 80);
      --color-neutral-500: oklch(0.65 0.006 80);
      --color-neutral-600: oklch(0.55 0.006 80);
      --color-neutral-700: oklch(0.45 0.006 80);
      --color-neutral-800: oklch(0.35 0.006 80);
      --color-neutral-900: oklch(0.25 0.006 80);

      /* Semantic */
      --color-success: oklch(0.55 0.12 145);
      --color-warning: oklch(0.72 0.14 70);
      --color-error: oklch(0.55 0.16 25);
      --color-info: oklch(0.55 0.10 240);

      /* Background */
      --color-bg-page: #FFFFFF;
      --color-bg-card: #FFFFFF;
      --color-bg-section: var(--color-neutral-100);
      --color-bg-elevated: #FFFFFF;

      /* Typography */
      --font-heading: 'Inter', 'Noto Sans JP', system-ui, sans-serif;
      --font-body: 'Inter', 'Noto Sans JP', system-ui, sans-serif;
      --text-xs: clamp(0.6875rem, 0.65rem + 0.1vw, 0.75rem);
      --text-sm: clamp(0.75rem, 0.7rem + 0.15vw, 0.8125rem);
      --text-base: clamp(0.8125rem, 0.75rem + 0.2vw, 0.9375rem);
      --text-lg: clamp(0.9375rem, 0.85rem + 0.25vw, 1.0625rem);
      --text-xl: clamp(1.125rem, 1rem + 0.3vw, 1.25rem);
      --text-2xl: clamp(1.375rem, 1.2rem + 0.5vw, 1.625rem);
      --text-3xl: clamp(1.75rem, 1.5rem + 0.7vw, 2.125rem);
      --weight-light: 300;
      --weight-normal: 400;
      --weight-medium: 500;
      --weight-semibold: 600;
      --leading-tight: 1.3;
      --leading-normal: 1.7;
      --leading-relaxed: 1.9;
      --tracking-tight: -0.02em;
      --tracking-normal: 0;
      --tracking-wide: 0.04em;

      /* Spacing */
      --space-xs: 0.25rem;
      --space-sm: 0.5rem;
      --space-md: 1rem;
      --space-lg: 1.5rem;
      --space-xl: 2rem;
      --space-2xl: 2.5rem;
      --space-3xl: 3.5rem;
      --space-section: 5rem;

      /* Border Radius */
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --radius-xl: 16px;
      --radius-full: 9999px;

      /* Shadow */
      --shadow-sm: 0 1px 2px oklch(0 0 0 / 0.04);
      --shadow-md: 0 2px 8px oklch(0 0 0 / 0.06);
      --shadow-lg: 0 4px 16px oklch(0 0 0 / 0.08);

      /* Transition */
      --transition-fast: 0.1s ease;
      --transition-default: 0.15s ease;
      --transition-slow: 0.25s ease;
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-body);
      color: var(--color-neutral-700);
      background-color: var(--color-bg-section);
      line-height: var(--leading-normal);
      font-weight: var(--weight-normal);
      font-size: var(--text-base);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ===== Header ===== */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--color-bg-page);
      border-bottom: 1px solid var(--color-neutral-300);
    }

    .header-inner {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 var(--space-2xl);
      height: 64px;
      display: flex;
      align-items: center;
    }

    .logo {
      font-family: var(--font-heading);
      font-size: var(--text-lg);
      font-weight: var(--weight-semibold);
      color: var(--color-neutral-900);
      text-decoration: none;
      letter-spacing: var(--tracking-tight);
    }

    .logo span {
      color: var(--color-primary);
    }

    /* ===== Main Content ===== */
    .main-content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-3xl) var(--space-xl);
    }

    .auth-card {
      width: 100%;
      max-width: 480px;
      background: var(--color-bg-card);
      border-radius: var(--radius-lg);
      border: 1px solid var(--color-neutral-300);
      padding: var(--space-2xl) var(--space-2xl);
    }

    .auth-badge {
      display: inline-flex;
      align-items: center;
      gap: var(--space-xs);
      padding: 4px 12px;
      background: var(--color-primary-lighter);
      color: var(--color-primary);
      border-radius: var(--radius-full);
      font-size: var(--text-xs);
      font-weight: var(--weight-medium);
      letter-spacing: var(--tracking-wide);
      margin-bottom: var(--space-md);
    }

    .auth-heading {
      font-family: var(--font-heading);
      font-size: var(--text-2xl);
      font-weight: var(--weight-semibold);
      color: var(--color-neutral-900);
      letter-spacing: var(--tracking-tight);
      line-height: var(--leading-tight);
      margin-bottom: var(--space-sm);
      text-align: center;
    }

    .auth-description {
      font-size: var(--text-sm);
      color: var(--color-neutral-500);
      text-align: center;
      line-height: var(--leading-normal);
      margin-bottom: var(--space-xl);
    }

    /* ===== Form ===== */
    .form-group {
      margin-bottom: var(--space-lg);
    }

    .form-label {
      display: block;
      font-size: var(--text-sm);
      font-weight: var(--weight-medium);
      color: var(--color-neutral-700);
      margin-bottom: var(--space-sm);
      letter-spacing: var(--tracking-wide);
    }

    .form-input {
      width: 100%;
      height: 44px;
      padding: 0 var(--space-md);
      font-family: var(--font-body);
      font-size: var(--text-base);
      font-weight: var(--weight-normal);
      color: var(--color-neutral-900);
      background: var(--color-bg-page);
      border: 1px solid var(--color-neutral-300);
      border-radius: var(--radius-md);
      outline: none;
      transition: border-color var(--transition-default), box-shadow var(--transition-default);
    }

    .form-input::placeholder {
      color: var(--color-neutral-500);
    }

    .form-input:hover {
      border-color: var(--color-neutral-400);
    }

    .form-input:focus {
      border-color: var(--color-primary);
      outline: 2px solid var(--color-primary);
      outline-offset: 2px;
    }

    /* ===== Submit Button ===== */
    .btn-primary {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 44px;
      padding: 0 var(--space-xl);
      background: var(--color-primary);
      color: #FFFFFF;
      border: none;
      border-radius: var(--radius-md);
      font-family: var(--font-body);
      font-size: var(--text-base);
      font-weight: var(--weight-medium);
      cursor: pointer;
      transition: background var(--transition-default), transform var(--transition-fast);
      letter-spacing: var(--tracking-wide);
      margin-top: var(--space-xl);
    }

    .btn-primary:hover {
      background: var(--color-primary-dark);
    }

    .btn-primary:active {
      transform: scale(0.99);
      background: var(--color-primary-darker);
    }

    .btn-primary:focus-visible {
      outline: 2px solid var(--color-primary);
      outline-offset: 2px;
    }

    /* ===== Links ===== */
    .auth-links {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-sm);
      margin-top: var(--space-lg);
    }

    .auth-link-subtle {
      font-size: var(--text-sm);
      color: var(--color-neutral-500);
      text-decoration: none;
      font-weight: var(--weight-normal);
      transition: color var(--transition-default);
    }

    .auth-link-subtle:hover {
      color: var(--color-primary);
    }

    .auth-link-subtle:focus-visible {
      outline: 2px solid var(--color-primary);
      outline-offset: 2px;
      border-radius: var(--radius-sm);
    }

    /* ===== Footer ===== */
    .footer {
      border-top: 1px solid var(--color-neutral-300);
      background: var(--color-bg-page);
    }

    .footer-inner {
      max-width: 1280px;
      margin: 0 auto;
      padding: var(--space-xl) var(--space-2xl);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .footer-logo {
      font-family: var(--font-heading);
      font-size: var(--text-base);
      font-weight: var(--weight-semibold);
      color: var(--color-neutral-500);
      text-decoration: none;
    }

    .footer-logo span {
      color: var(--color-primary);
    }

    .footer-copy {
      font-size: var(--text-xs);
      color: var(--color-neutral-500);
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-inner">
      <a href="#" class="logo"><span>dot.</span>reservation</a>
    </div>
  </header>

  <!-- Main -->
  <main class="main-content">
    <div class="auth-card">
      <div style="text-align: center;">
        <span class="auth-badge">管理画面</span>
      </div>
      <h1 class="auth-heading">パスワードリセット</h1>
      <p class="auth-description">ご登録のメールアドレスを入力してください。パスワード再設定用のリンクをお送りします。</p>

      <form>
        <div class="form-group">
          <label class="form-label" for="email">メールアドレス</label>
          <input
            class="form-input"
            type="email"
            id="email"
            name="email"
            placeholder="example@email.com"
            autocomplete="email"
          >
        </div>

        <button type="submit" class="btn-primary">リセットリンクを送信</button>
      </form>

      <div class="auth-links">
        <a href="admin-login.html" class="auth-link-subtle">ログインに戻る</a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-inner">
      <a href="#" class="footer-logo"><span>dot.</span>reservation</a>
      <p class="footer-copy">&copy; 2026 dot.reservation All rights reserved.</p>
    </div>
  </footer>

</body>
</html>
