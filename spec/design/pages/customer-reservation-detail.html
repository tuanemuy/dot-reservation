<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>予約詳細 - マイページ - dot.reservation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Sans+JP:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Primary (Sage Green) */
      --color-primary-lighter: oklch(0.96 0.02 155);
      --color-primary-light: oklch(0.78 0.06 155);
      --color-primary: oklch(0.52 0.08 155);
      --color-primary-dark: oklch(0.45 0.07 155);
      --color-primary-darker: oklch(0.36 0.06 155);

      /* Secondary (Rose) */
      --color-secondary-lighter: oklch(0.96 0.02 350);
      --color-secondary-light: oklch(0.84 0.06 350);
      --color-secondary: oklch(0.65 0.12 350);
      --color-secondary-dark: oklch(0.52 0.12 350);
      --color-secondary-darker: oklch(0.40 0.12 350);

      /* Accent (Warm Gold) */
      --color-accent-lighter: oklch(0.97 0.02 75);
      --color-accent-light: oklch(0.84 0.08 75);
      --color-accent: oklch(0.67 0.11 75);
      --color-accent-dark: oklch(0.53 0.10 75);
      --color-accent-darker: oklch(0.43 0.09 75);

      /* Neutral */
      --color-neutral-50: oklch(0.99 0.002 80);
      --color-neutral-100: oklch(0.97 0.004 80);
      --color-neutral-200: oklch(0.94 0.005 80);
      --color-neutral-300: oklch(0.88 0.006 80);
      --color-neutral-400: oklch(0.78 0.006 80);
      --color-neutral-500: oklch(0.65 0.006 80);
      --color-neutral-600: oklch(0.55 0.006 80);
      --color-neutral-700: oklch(0.45 0.006 80);
      --color-neutral-800: oklch(0.35 0.006 80);
      --color-neutral-900: oklch(0.25 0.006 80);

      /* Semantic */
      --color-success: oklch(0.55 0.12 145);
      --color-warning: oklch(0.72 0.14 70);
      --color-error: oklch(0.55 0.16 25);
      --color-info: oklch(0.55 0.10 240);

      /* Background */
      --color-bg-page: #FFFFFF;
      --color-bg-card: #FFFFFF;
      --color-bg-section: var(--color-neutral-100);
      --color-bg-elevated: #FFFFFF;

      /* Typography */
      --font-heading: 'Inter', 'Noto Sans JP', system-ui, sans-serif;
      --font-body: 'Inter', 'Noto Sans JP', system-ui, sans-serif;
      --text-xs: clamp(0.6875rem, 0.65rem + 0.1vw, 0.75rem);
      --text-sm: clamp(0.75rem, 0.7rem + 0.15vw, 0.8125rem);
      --text-base: clamp(0.8125rem, 0.75rem + 0.2vw, 0.9375rem);
      --text-lg: clamp(0.9375rem, 0.85rem + 0.25vw, 1.0625rem);
      --text-xl: clamp(1.125rem, 1rem + 0.3vw, 1.25rem);
      --text-2xl: clamp(1.375rem, 1.2rem + 0.5vw, 1.625rem);
      --text-3xl: clamp(1.75rem, 1.5rem + 0.7vw, 2.125rem);
      --weight-light: 300;
      --weight-normal: 400;
      --weight-medium: 500;
      --weight-semibold: 600;
      --leading-tight: 1.3;
      --leading-normal: 1.7;
      --leading-relaxed: 1.9;
      --tracking-tight: -0.02em;
      --tracking-normal: 0;
      --tracking-wide: 0.04em;

      /* Spacing */
      --space-xs: 0.25rem;
      --space-sm: 0.5rem;
      --space-md: 1rem;
      --space-lg: 1.5rem;
      --space-xl: 2rem;
      --space-2xl: 2.5rem;
      --space-3xl: 3.5rem;
      --space-section: 5rem;

      /* Border Radius */
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --radius-xl: 16px;
      --radius-full: 9999px;

      /* Shadow */
      --shadow-sm: 0 1px 2px oklch(0 0 0 / 0.04);
      --shadow-md: 0 2px 8px oklch(0 0 0 / 0.06);
      --shadow-lg: 0 4px 16px oklch(0 0 0 / 0.08);

      /* Transition */
      --transition-fast: 0.1s ease;
      --transition-default: 0.15s ease;
      --transition-slow: 0.25s ease;
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-body);
      color: var(--color-neutral-700);
      background-color: var(--color-bg-page);
      line-height: var(--leading-normal);
      font-weight: var(--weight-normal);
      font-size: var(--text-base);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ===== Header ===== */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--color-bg-page);
      border-bottom: 1px solid var(--color-neutral-300);
    }

    .header-inner {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 var(--space-2xl);
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-family: var(--font-heading);
      font-size: var(--text-lg);
      font-weight: var(--weight-semibold);
      color: var(--color-neutral-900);
      text-decoration: none;
      letter-spacing: var(--tracking-tight);
    }

    .logo span { color: var(--color-primary); }

    .header-actions {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
    }

    .header-icon-btn {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-md);
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-neutral-500);
      transition: background var(--transition-default), color var(--transition-default);
      position: relative;
    }

    .header-icon-btn:hover {
      background: var(--color-neutral-200);
      color: var(--color-neutral-800);
    }

    .header-icon-btn:focus-visible {
      outline: 2px solid var(--color-primary);
      outline-offset: 2px;
    }

    .header-icon-btn svg { width: 20px; height: 20px; }

    .header-icon-btn.has-notification::after {
      content: '';
      position: absolute;
      top: 8px;
      right: 8px;
      width: 8px;
      height: 8px;
      background: var(--color-accent);
      border-radius: var(--radius-full);
      border: 2px solid var(--color-bg-page);
    }

    /* ===== Breadcrumb ===== */
    .breadcrumb {
      padding: var(--space-md) 0;
      font-size: var(--text-sm);
      color: var(--color-neutral-500);
      display: flex;
      align-items: center;
      gap: var(--space-sm);
    }

    .breadcrumb a {
      color: var(--color-neutral-500);
      text-decoration: none;
      transition: color var(--transition-default);
    }

    .breadcrumb a:hover { color: var(--color-primary); }
    .breadcrumb-sep { color: var(--color-neutral-300); }
    .breadcrumb-current { color: var(--color-neutral-700); }

    /* ===== Main Layout ===== */
    .main-container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 var(--space-2xl);
    }

    .mypage-layout {
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: var(--space-2xl);
      padding-bottom: var(--space-section);
    }

    /* ===== Sidebar ===== */
    .sidebar {
      padding-top: var(--space-sm);
    }

    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
    }

    .sidebar-nav-item {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      padding: var(--space-sm) var(--space-md);
      font-size: var(--text-base);
      font-weight: var(--weight-normal);
      color: var(--color-neutral-600);
      text-decoration: none;
      border-radius: var(--radius-md);
      transition: background var(--transition-default), color var(--transition-default);
    }

    .sidebar-nav-item:hover {
      background: var(--color-neutral-200);
      color: var(--color-neutral-800);
    }

    .sidebar-nav-item:focus-visible {
      outline: 2px solid var(--color-primary);
      outline-offset: 2px;
    }

    .sidebar-nav-item.active {
      background: var(--color-primary-lighter);
      color: var(--color-primary);
      font-weight: var(--weight-medium);
    }

    .sidebar-nav-item svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    /* ===== Content Area ===== */
    .content-area {
      min-width: 0;
    }

    .page-header {
      display: flex;
      align-items: center;
      gap: var(--space-md);
      margin-bottom: var(--space-xl);
    }

    .page-title {
      font-family: var(--font-heading);
      font-size: var(--text-2xl);
      font-weight: var(--weight-semibold);
      color: var(--color-neutral-900);
      letter-spacing: var(--tracking-tight);
      line-height: var(--leading-tight);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      padding: var(--space-xs) var(--space-sm);
      font-size: var(--text-sm);
      font-weight: var(--weight-medium);
      border-radius: var(--radius-sm);
      letter-spacing: var(--tracking-wide);
    }

    .status-badge.success {
      background: oklch(0.55 0.12 145 / 0.1);
      color: var(--color-success);
    }

    /* ===== Detail Card ===== */
    .detail-card {
      background: var(--color-bg-card);
      border: 1px solid var(--color-neutral-300);
      border-radius: var(--radius-lg);
      padding: var(--space-xl);
      margin-bottom: var(--space-lg);
    }

    .detail-section-title {
      font-family: var(--font-heading);
      font-size: var(--text-lg);
      font-weight: var(--weight-semibold);
      color: var(--color-neutral-800);
      letter-spacing: var(--tracking-tight);
      margin-bottom: var(--space-lg);
      padding-bottom: var(--space-sm);
      border-bottom: 1px solid var(--color-neutral-200);
    }

    .detail-grid {
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }

    .detail-row {
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: var(--space-md);
      align-items: baseline;
    }

    .detail-label {
      font-size: var(--text-sm);
      font-weight: var(--weight-medium);
      color: var(--color-neutral-500);
      letter-spacing: var(--tracking-wide);
    }

    .detail-value {
      font-size: var(--text-base);
      color: var(--color-neutral-800);
    }

    .detail-value a {
      color: var(--color-primary);
      text-decoration: none;
      font-weight: var(--weight-medium);
      transition: color var(--transition-default);
    }

    .detail-value a:hover {
      color: var(--color-primary-dark);
    }

    .detail-value-price {
      font-size: var(--text-lg);
      font-weight: var(--weight-semibold);
      color: var(--color-accent-dark);
    }

    .detail-value-price .tax {
      font-size: var(--text-xs);
      font-weight: var(--weight-normal);
      color: var(--color-neutral-500);
    }

    .detail-note {
      font-size: var(--text-sm);
      color: var(--color-neutral-600);
      line-height: var(--leading-relaxed);
      background: var(--color-neutral-100);
      padding: var(--space-md);
      border-radius: var(--radius-md);
    }

    /* ===== Action Buttons ===== */
    .action-buttons {
      display: flex;
      gap: var(--space-md);
      margin-top: var(--space-xl);
    }

    .btn-outline {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-sm);
      height: 44px;
      padding: 0 var(--space-lg);
      background: var(--color-bg-card);
      border: 1px solid var(--color-neutral-300);
      border-radius: var(--radius-md);
      font-size: var(--text-base);
      font-weight: var(--weight-medium);
      cursor: pointer;
      transition: background var(--transition-default), border-color var(--transition-default), color var(--transition-default), transform var(--transition-fast);
      font-family: inherit;
      text-decoration: none;
    }

    .btn-outline:focus-visible {
      outline: 2px solid var(--color-primary);
      outline-offset: 2px;
    }

    .btn-outline:active {
      transform: scale(0.99);
    }

    .btn-outline.secondary {
      color: var(--color-neutral-700);
      border-color: var(--color-neutral-300);
    }

    .btn-outline.secondary:hover {
      background: var(--color-neutral-100);
      border-color: var(--color-neutral-400);
    }

    .btn-outline.error {
      color: var(--color-error);
      border-color: var(--color-error);
    }

    .btn-outline.error:hover {
      background: oklch(0.55 0.16 25 / 0.05);
    }

    .btn-outline svg {
      width: 16px;
      height: 16px;
    }

    /* ===== Footer ===== */
    .footer {
      border-top: 1px solid var(--color-neutral-300);
      margin-top: var(--space-2xl);
    }

    .footer-inner {
      max-width: 1280px;
      margin: 0 auto;
      padding: var(--space-xl) var(--space-2xl);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .footer-logo {
      font-family: var(--font-heading);
      font-size: var(--text-base);
      font-weight: var(--weight-semibold);
      color: var(--color-neutral-500);
      text-decoration: none;
    }

    .footer-logo span { color: var(--color-primary); }

    .footer-copy {
      font-size: var(--text-xs);
      color: var(--color-neutral-500);
    }
  </style>
</head>
<body>
